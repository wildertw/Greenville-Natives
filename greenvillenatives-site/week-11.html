  <script>
  (function(){
    const D = JSON.parse(document.getElementById("writeup-data").textContent);
    const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    // minimal inline markdown: **bold**, *italic* (applied after escaping)
    const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");
    const paras = a => (a||[]).map(t=>`<p>${md(t)}</p>`).join("");
    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

    // Manager color schemes (from the WriteupStats tab) and headshot files (headshots/<slug>.png)
    const MGR = {
      "Ian":    {slug:"ian-baro",        bg:"#0000FF", fg:"#FFFFFF", ini:"IB"},
      "T Wood": {slug:"t-wood",          bg:"#38761D", fg:"#FF9900", ini:"TW"},
      "Trey":   {slug:"trey-wilder",     bg:"#CEB888", fg:"#990000", ini:"TR"},
      "Hud":    {slug:"josh-hudson",     bg:"#00B0F0", fg:"#FFFFFF", ini:"JH"},
      "Waivers":{slug:"michael-waivers", bg:"#00FFFF", fg:"#9F80FF", ini:"MW"},
      "Galt":   {slug:"lee-galt",        bg:"#980000", fg:"#CCCCCC", ini:"LG"},
      "Rex":    {slug:"taylor-hardee",   bg:"#FFFF00", fg:"#FF0000", ini:"TH"},
      "Clod":   {slug:"cody-clodfelter", bg:"#674EA7", fg:"#FFFF00", ini:"CC"},
      "Potter": {slug:"mark-potter",     bg:"#0F45A8", fg:"#E6B8AF", ini:"MP"},
      "Shain":  {slug:"shain-collins",   bg:"#FF0000", fg:"#FFFFFF", ini:"SC"}
    };
    const sty = n => MGR[n] ? `--bg:${MGR[n].bg};--fg:${MGR[n].fg}` : "";
    // headshot circle; if headshots/<slug>.png is missing the image removes itself and the initials show
    const av = (n,px) => { const m=MGR[n]; if(!m) return ""; return `<span class="av" style="${sty(n)};width:${px}px;height:${px}px;font-size:${Math.round(px*.34)}px"><span>${m.ini}</span><img src="headshots/${m.slug}.png" alt="${esc(n)}" loading="lazy" onerror="this.remove()"></span>`; };
    const pill = n => `<span class="pill" style="${sty(n)}">${av(n,22)}${esc(n)}</span>`;

    function hero(){
      return D.header_image
        ? `<div class="hero"><img src="${esc(D.header_image)}" alt=""></div>`
        : `<div class="hero" data-placeholder="header-image">[ HEADER IMAGE PLACEHOLDER — Trey uploads this, then set header_image ]</div>`;
    }
    function hermania(){
      const h = D.hermania;
      const th = h.table_head.map((c,i)=>`<th class="${i===1||i===4?"num":""}">${esc(c)}</th>`).join("");
      const tr = h.table_rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===1||i===4?"num":""}">${md(c)}</td>`).join("")}</tr>`).join("");
      return `<div class="quote">${esc(h.quote)}</div>${paras(h.before)}
        <div class="tableWrap"><table id="hermaniaTable"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>${paras(h.after)}`;
    }
    function rankings(){
      return D.power_rankings.map(r=>`<article class="card mgr" style="${sty(r.team)}" data-rank="${r.rank}">
          <div class="rankHead">${av(r.team,64)}<div><h3><span class="rankNum">${r.rank}.</span> ${esc(r.team)} — “${esc(r.song)}”</h3>
          <div class="song">${esc(r.artist)}</div></div></div>
          <div class="chips">${r.stats.split(" · ").map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div>
          <div class="sched">${esc(r.schedule)}</div>
          ${paras(r.body)}</article>`).join("");
    }
    function results(){
      const rows = D.week11_results.map(g=>`<tr><td>${pill(g.winner)}</td><td>${pill(g.loser)}</td><td>${g.winner_score.toFixed(1)}–${g.loser_score.toFixed(1)}</td><td class="num">${g.margin.toFixed(1)}</td><td class="marks">${g.marks.length?g.marks.map(m=>`<span class="m">${esc(m)}</span>`).join(""):"—"}</td></tr>`).join("");
      return `<div class="tableWrap"><table id="resultsTable"><thead><tr><th>Winner</th><th>Loser</th><th>Score</th><th class="num">Margin</th><th>Marks</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    function preview(){
      return D.week12_preview.matchups.map(m=>{
        const body=m.stats.map(r=>`<tr><td>${esc(r[0])}</td><td class="num">${esc(r[1])}</td><td class="num">${esc(r[2])}</td></tr>`).join("");
        return `<article class="card previewCard"><h3>${esc(m.label)}</h3><div style="margin:8px 0 12px;display:flex;gap:8px;flex-wrap:wrap">${pill(m.teams[0])}${pill(m.teams[1])}</div>
          <div class="tableWrap"><table class="stat"><thead><tr><th></th><th class="num mg" style="${sty(m.teams[0])}">${av(m.teams[0],28)}${esc(m.teams[0])}</th><th class="num mg" style="${sty(m.teams[1])}">${av(m.teams[1],28)}${esc(m.teams[1])}</th></tr></thead><tbody>${body}</tbody></table></div>
          ${paras(m.text)}</article>`;}).join("");
    }
    document.getElementById("app").innerHTML = `
      <header><div class="fine">${esc(D.subtitle)}</div><h1>${esc(D.title)}</h1></header>
      ${hero()}
      <div class="prose">${paras(D.intro)}</div>
      <h2 class="section" id="hermania">${esc(D.hermania.heading)}</h2>${hermania()}
      <h2 class="section" id="power-rankings">Week 11 Power Rankings</h2>${rankings()}
      <h2 class="section" id="week-11-recap">Week 11 Recap</h2>
      <h3>Week 11 Results</h3>${results()}
      <h2 class="section" id="week-12-preview">Week 12 Preview</h2>${preview()}
      <p class="fine">${md(D.marks_note)}</p>
      <p class="fine">${md(D.methodology_note)}</p>`;

    const root=document.documentElement; let saved=null;
    try{ for(const k of Object.keys(localStorage)){ if(/theme/i.test(k)){ const v=localStorage.getItem(k); if(v==="light"||v==="dark"){saved=v;break;} } } }catch(e){}
    root.setAttribute("data-theme", saved || (matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
    document.getElementById("themeBtn").onclick=()=>root.setAttribute("data-theme",root.getAttribute("data-theme")==="dark"?"light":"dark");
  })();
